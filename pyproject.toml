[project]
name = "ptb-starlette-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "jinja2==3.1.6",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.22",
    "python-telegram-bot[rate-limiter]==22.6",
    "sqlalchemy==2.0.46",
    "starlette==0.52.1",
    "uvicorn==0.41.0",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["union-attr"]
